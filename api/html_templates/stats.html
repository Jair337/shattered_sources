<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px auto;
            max-width: 600px;
            text-align: center;
            background-color: #f9f9f9;
            color: #333;
        }
        h1 {
            color: #2c3e50;
        }
        p {
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .button-container {
            margin: 15px;
        }
    </style>
</head>
<body>

    <h1>Stats page</h1>
    <p>Welcome to the stats page, select which page you'd like to see:</p>

<div class="button-container">
    <a href="{{ url_for('macro_stats') }}" class="btn" style="text-decoration: none;">Macro view</a>
</div>

<div class="button-container">
    <a href="{{ url_for('time_charts') }}" class="btn" style="text-decoration: none;">Time charts</a>
</div>

<div class="button-container">
    <a href="{{ url_for('time_charts_custom') }}" class="btn" style="text-decoration: none;">Custom time charts</a>
</div>

<div class="button-container">
    <a href="{{ url_for('list_events') }}" class="btn" style="text-decoration: none;">Distribution charts</a>
</div>

<div class="button-container">
    <a href="{{ url_for('list_events') }}" class="btn" style="text-decoration: none;">Geographic charts</a>
</div>

<div class="button-container">
    <a href="/" class="btn" style="background-color: coral; border-color: black">Home</a>
</div>

    </body>
</html>
