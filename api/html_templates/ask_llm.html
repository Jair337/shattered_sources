JavaScript Functionality (sendMessage):

Trigger: The message should send when clicking the "Send" button or pressing the "Enter" key inside the input field. Empty or whitespace-only inputs should be ignored.

UI Updates: Instantly clear the input and append the user's text to the chat. Immediately follow it with a temporary "Thinking..." bot message that has a unique ID (e.g., using a timestamp).

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Database Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 450px;
            height: 600px;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #007bff;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }
        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            border-bottom: 1px solid #ddd;
        }
        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            max-width: 80%;
        }
        .user-message {
            background: #e1f5fe;
            margin-left: auto;
            text-align: right;
        }
        .bot-message {
            background: #f1f1f1;
            margin-right: auto;
        }
        .chat-input-area {
            display: flex;
            padding: 10px;
            background: #fff;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            outline: none;
        }
        .chat-input-area button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            margin-left: 5px;
            border-radius: 5px;
            cursor: pointer;
        }
        .chat-input-area button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">Event DB Assistant</div>
    <div class="chat-box" id="chatBox">
        <div class="message bot-message">Hello! Ask me anything about the events database.</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Ask a question..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const question = inputField.value.trim();

        if (!question) return;

        // Append user message to chat
        chatBox.innerHTML += `<div class="message user-message">${question}</div>`;
        inputField.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        // Append a temporary loading message
        const loadingId = 'loading-' + Date.now();
        chatBox.innerHTML += `<div class="message bot-message" id="${loadingId}">Thinking...</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // Send request to Flask backend
            const response = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: question })
            });
            const data = await response.json();

            // Remove loading message
            document.getElementById(loadingId).remove();

            // Build response based on "results" key sent by Python
            if (!data.results || data.results.length === 0) {
                chatBox.innerHTML += `<div class="message bot-message">No matching events found.</div>`;
            } else {
                let replyHtml = "Here is what I found:<br><ul style='margin: 5px 0; padding-left: 20px;'>";
                data.results.forEach(row => {
                    // Falls back to generic mapping if structure varies
                    const name = row[0] || "Unknown Event";
                    const desc = row[1] || "No description provided.";
                    const time_stamp = row[2] || "No timestamp provided.";
                    replyHtml += `<li><strong>${name}</strong>: ${desc}, ${time_stamp}</li>`;
                });
                replyHtml += "</ul>";
                chatBox.innerHTML += `<div class="message bot-message">${replyHtml}</div>`;
            }

        } catch (error) {
            if (document.getElementById(loadingId)) {
                document.getElementById(loadingId).remove();
            }
            chatBox.innerHTML += `<div class="message bot-message">Error connecting to server.</div>`;
        }

        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
